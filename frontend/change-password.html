<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirana ERP — Change Password</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/auth.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0f1e;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 217, 160, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(59, 130, 246, 0.07) 0%, transparent 50%);
            font-family: 'Inter', sans-serif;
            padding: 24px;
        }

        .cp-wrapper {
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cp-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .cp-title {
            font-size: 24px;
            font-weight: 700;
            color: #f0f4fc;
            margin-bottom: 8px;
        }

        .cp-subtitle {
            font-size: 14px;
            color: #8ba0c8;
        }

        /* Card */
        .cp-card {
            background: #0f1521;
            border: 1px solid #1e2d45;
            border-radius: 20px;
            padding: 32px 36px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .cp-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #f59e0b, #ef4444);
        }

        /* Input */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: #8ba0c8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            text-align: left;
        }

        .pw-field {
            position: relative;
        }

        .pw-field input {
            width: 100%;
            background: #141c2e;
            border: 1px solid #1e2d45;
            border-radius: 12px;
            padding: 12px 46px 12px 16px;
            color: #f0f4fc;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            letter-spacing: 0.1em;
        }

        .pw-field input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
        }

        .pw-toggle {
            position: absolute;
            right: 14px;
            bottom: 13px;
            background: none;
            border: none;
            color: #4a5c80;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
        }

        .pw-toggle:hover {
            color: #f59e0b;
        }

        /* Error */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            color: #ef4444;
            font-size: 13px;
            padding: 10px 14px;
            margin-bottom: 24px;
            display: none;
            text-align: left;
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Shake animation on wrong password */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-6px);
            }

            80% {
                transform: translateX(6px);
            }
        }

        .shake {
            animation: shake 0.45s ease;
        }
    </style>
</head>

<body>
    <div class="cp-wrapper">
        <div class="cp-header">
            <h1 class="cp-title">Update Required</h1>
            <p class="cp-subtitle">Your password must be changed before continuing to the application.</p>
        </div>

        <div class="cp-card" id="cpCard">
            <div class="error-msg" id="errorMsg"></div>

            <form id="cpForm" onsubmit="handleChangePassword(event)">
                <div class="form-group">
                    <label>Current Password</label>
                    <div class="pw-field">
                        <input type="password" id="oldPassword" placeholder="••••••••" autocomplete="current-password"
                            autofocus required>
                        <button type="button" class="pw-toggle" onclick="togglePw('oldPassword')">👁</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <div class="pw-field">
                        <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password"
                            required minlength="6">
                        <button type="button" class="pw-toggle" onclick="togglePw('newPassword')">👁</button>
                    </div>
                </div>

                <div class="form-group mb-30" style="margin-bottom: 30px;">
                    <label>Confirm New Password</label>
                    <div class="pw-field">
                        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password"
                            required minlength="6">
                        <button type="button" class="pw-toggle" onclick="togglePw('confirmPassword')">👁</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Update Password</button>
            </form>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Redirect if already changed
        if (localStorage.getItem('must_change_password') !== '1') {
            window.location.href = localStorage.getItem('role') === 'admin' ? 'index.html' : 'billing.html';
        }

        function showToast(msg, type = 'info') {
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<span>${icons[type]}</span><span class="toast-msg">${msg}</span>`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        function togglePw(id) {
            const inp = document.getElementById(id);
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        async function handleChangePassword(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errEl = document.getElementById('errorMsg');
            const card = document.getElementById('cpCard');

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                errEl.textContent = 'New passwords do not match.';
                errEl.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                errEl.textContent = 'New password must be at least 6 characters.';
                errEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating…';
            errEl.style.display = 'none';

            try {
                const res = await fetch('/api/v1/auth/change-my-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    card.classList.remove('shake');
                    void card.offsetWidth;
                    card.classList.add('shake');

                    errEl.textContent = data.message || data.errors?.[0]?.message || 'Update failed.';
                    errEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                    return;
                }

                showToast('Password updated successfully!', 'success');
                localStorage.removeItem('must_change_password');
                btn.textContent = '✅ Updated!';

                setTimeout(() => {
                    const role = localStorage.getItem('role');
                    window.location.href = role === 'admin' ? 'index.html' : 'billing.html';
                }, 800);

            } catch (err) {
                errEl.textContent = 'Network error. Is the server running?';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        }
    </script>
</body>

</html>
