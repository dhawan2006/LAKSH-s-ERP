<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirana ERP — Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/auth.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 0%, #1a2540 0%, var(--bg-body) 70%);
            margin: 0;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .brand-logo {
            justify-content: center;
            margin-bottom: 30px;
            transform: scale(1.2);
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), #38bdf8);
        }

        .form-title {
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-primary);
            font-size: 22px;
        }

        .error-msg {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="brand-logo">
            <div class="brand-icon">K</div>
            <div class="brand-text">
                <h2>Kirana ERP</h2>
                <span>Business Suite</span>
            </div>
        </div>

        <div class="login-card">
            <h2 class="form-title">Welcome Back</h2>

            <div id="errorMsg" class="error-msg"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group mb-16">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required autofocus
                        autocomplete="username">
                </div>
                <div class="form-group mb-20">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn"
                    style="font-weight: 600;">Secure Login</button>
            </form>
            <div style="text-align:center; margin-top:20px; font-size:12px; color:var(--text-muted);">
                Protected by Industry Standard Security
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = localStorage.getItem('role') === 'admin' ? 'index.html' : 'billing.html';
        }

        function showToast(msg, type = 'info') {
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<span>${icons[type]}</span><span class="toast-msg">${msg}</span>`;
            document.getElementById('toastContainer').appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errBox = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.textContent = 'Authenticating...';
            errBox.style.display = 'none';

            try {
                // Not bypassing fetch override because auth.js doesn't override /api/v1/auth/login 
                // wait, the override does pass it through.
                const res = await window.fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    errBox.textContent = data.message || 'Login failed';
                    errBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Secure Login';
                    return;
                }

                // Success
                const user = data.data;
                localStorage.setItem('token', user.token);
                localStorage.setItem('role', user.role);
                localStorage.setItem('name', user.name);
                localStorage.setItem('user', user.name);

                if (user.must_change_password) {
                    localStorage.setItem('must_change_password', '1');
                } else {
                    localStorage.removeItem('must_change_password');
                }

                showToast(`Welcome back, ${user.name}!`, 'success');

                setTimeout(() => {
                    if (user.must_change_password) {
                        window.location.href = 'change-password.html';
                    } else {
                        window.location.href = user.role === 'admin' ? 'index.html' : 'billing.html';
                    }
                }, 800);

            } catch (err) {
                errBox.textContent = 'Network error. Cannot reach server.';
                errBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Secure Login';
            }
        }
    </script>
</body>

</html>
